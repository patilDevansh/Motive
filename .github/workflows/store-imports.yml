name: Store imports and product statistics
on: [push, pull_request]
permissions:
  contents: read
jobs:
  store-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-imports.txt pandas
      - run: python -m pytest tests/test_S2_*.py tests/test_product_stats.py -q
